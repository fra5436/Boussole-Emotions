<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12161C">
<meta name="description" content="Repérer, nommer et noter ses émotions. Référentiel et journal de bord.">
<title>Boussole des émotions</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --fond:#12161C;
  --surface:#1B212A;
  --surface-2:#232B36;
  --trait:#2E3743;
  --texte:#EAE7E1;
  --texte-doux:#95A0AD;
  --accent:#D8B98A;
  --accent-doux:rgba(216,185,138,.08);
  --sur-accent:#12161C;
  --danger:#E8503A;
  --corps-fond:#0B0E13;
  --corps-trait:#2E3743;
  --ombre:0 8px 26px rgba(0,0,0,.5);
  --r:14px;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
:root[data-theme="clair"]{
  --fond:#F5F6F8;
  --surface:#FFFFFF;
  --surface-2:#EEF0F3;
  --trait:#DCE0E6;
  --texte:#1A1F27;
  --texte-doux:#5F6B7A;
  --accent:#9A6A2E;
  --accent-doux:rgba(154,106,46,.07);
  --sur-accent:#FFFFFF;
  --danger:#C1382A;
  --corps-fond:#E8EBEF;
  --corps-trait:#C8CFD8;
  --ombre:0 6px 20px rgba(20,30,45,.16);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--fond);color:var(--texte);
  font-family:var(--sans);font-size:16px;line-height:1.5;
  overscroll-behavior-y:none;
}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}

/* ---------- En-tete ---------- */
.topbar{position:sticky;top:0;z-index:30;background:var(--fond);padding:18px 20px 14px}
.wordmark{font-family:var(--serif);font-size:23px;letter-spacing:.01em;margin:0;font-weight:400}
.wordmark em{font-style:normal;color:var(--accent)}
.tagline{margin:2px 0 0;font-size:12.5px;color:var(--texte-doux);letter-spacing:.02em}

/* ---------- Onglets ---------- */
.tabs{display:flex;gap:26px;padding:0 20px;border-bottom:1px solid var(--trait);position:sticky;top:0;z-index:29;background:var(--fond)}
.tab{padding:11px 0 10px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--texte-doux);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--texte);border-bottom-color:var(--accent)}
.tab:focus-visible,.icon-btn:focus-visible,.chip:focus-visible,.card-head:focus-visible,.entry:focus-visible,.fab:focus-visible,.btn:focus-visible,.emo-btn:focus-visible,.reglages-item:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

main{padding:18px 20px calc(120px + var(--safe-b))}
.hidden{display:none !important}

/* ---------- Cartes du referentiel ---------- */
.card{border:1px solid var(--trait);border-radius:var(--r);background:var(--surface);margin-bottom:10px;overflow:hidden}
.card-head{display:flex;align-items:center;gap:13px;width:100%;text-align:left;padding:15px 16px}
.pastille{width:11px;height:11px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 0 4px var(--accent-doux)}
.card-nom{font-family:var(--serif);font-size:21px;flex:1;letter-spacing:.01em}
.chevron{color:var(--texte-doux);font-size:13px;transition:transform .22s ease}
.card[open-state="1"] .chevron{transform:rotate(90deg)}
.card-body{padding:16px 16px 18px;border-top:1px solid var(--trait)}

.label{font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--texte-doux);margin:0 0 7px}
.bloc{margin:0 0 18px}
.bloc:last-child{margin-bottom:0}
.bloc p{margin:0}
.liste{margin:0;padding-left:18px}
.liste li{margin-bottom:5px}
.liste li::marker{color:var(--texte-doux)}
.mots{display:flex;flex-wrap:wrap;gap:6px}
.mot{font-size:13px;padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--texte);border:1px solid var(--trait)}
.note{font-size:14px;color:var(--texte-doux);border-left:2px solid var(--trait);padding-left:12px;margin:12px 0 0;font-style:italic}

/* ---------- Schema corporel ---------- */
.corps-wrap{display:flex;gap:14px;align-items:flex-start}
.corps-txt{flex:1;min-width:0}
.corps{width:104px;flex:0 0 104px}
.corps svg{width:100%;height:auto;display:block}
.corps-flottant{float:right;width:104px;margin:0 0 8px 18px;shape-outside:inset(0 0 0 12%)}
.silhouette{fill:#141920;stroke:#39424E;stroke-width:1}
.echelle{width:100%;height:9px;display:block;margin-top:5px}
.provenance{margin:10px 0 0;font-size:11.5px;color:var(--texte-doux);font-style:italic}
.legende{font-size:9px;white-space:nowrap;color:var(--texte-doux);text-align:center;letter-spacing:.08em;text-transform:uppercase;margin:6px 0 0}

/* ---------- Intro ---------- */
.intro-titre{font-family:var(--serif);font-size:19px;margin:0;flex:1}
.chapeau{font-family:var(--serif);font-size:17px;color:var(--accent);margin:0 0 14px;line-height:1.4}
.encadre{border:1px solid var(--accent);border-radius:var(--r);padding:14px 15px;margin-top:16px;font-family:var(--serif);font-size:15.5px;line-height:1.55;background:var(--accent-doux)}

/* ---------- Journal ---------- */
.journal{position:relative;margin:0;padding:0;list-style:none}
.journal::before{content:"";position:absolute;left:5px;top:12px;bottom:12px;width:1px;background:var(--trait)}
.entry{position:relative;display:block;width:100%;text-align:left;padding:12px 4px 12px 26px;border-bottom:1px solid var(--trait)}
.journal li:last-child .entry{border-bottom:0}
.entry::before{content:"";position:absolute;left:0;top:19px;width:11px;height:11px;border-radius:50%;background:var(--dot);box-shadow:0 0 0 3px var(--fond)}
.entry-date{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--texte-doux)}
.entry-emo{font-family:var(--serif);font-size:19px;margin:1px 0 2px}
.entry-nuance{color:var(--texte-doux);font-family:var(--sans);font-size:14px;font-style:italic}
.entry-sit{margin:0;font-size:14px;color:var(--texte-doux);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jour-sep{font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--texte-doux);margin:20px 0 6px;padding-left:26px}
.jour-sep:first-child{margin-top:0}

.vide{text-align:center;padding:52px 20px;color:var(--texte-doux)}
.vide .corps{margin:0 auto 18px}
.vide h2{font-family:var(--serif);font-size:20px;color:var(--texte);margin:0 0 6px;font-weight:400}
.vide p{margin:0;font-size:14.5px;max-width:34ch;margin-inline:auto}

.voyant{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;vertical-align:middle}
.voyant.ok{background:#2FA36B;box-shadow:0 0 0 3px rgba(47,163,107,.18)}
.voyant.attente{background:#D89A2E;box-shadow:0 0 0 3px rgba(216,154,46,.18)}
.voyant.ko{background:var(--danger);box-shadow:0 0 0 3px rgba(193,56,42,.18)}
.bloc-install{padding:4px 0 18px;border-bottom:1px solid var(--trait);margin-bottom:4px}
.install-titre{margin:0 0 3px;font-family:var(--serif);font-size:18px}
.install-aide{margin:0 0 12px;font-size:13.5px;color:var(--texte-doux)}
.bloc-install .btn{margin-top:2px}
.bandeau-install{
  display:flex;align-items:center;gap:10px;width:calc(100% - 40px);max-width:600px;
  margin:0 20px 12px;padding:12px 14px;border-radius:var(--r);
  background:var(--accent-doux);border:1px solid var(--accent);color:var(--accent);
  font-size:14px;text-align:left;
}
.bandeau-install svg{width:18px;height:18px;flex:0 0 auto}
.bandeau-install span{flex:1}

/* ---------- FAB ---------- */
.fab{position:fixed;right:20px;bottom:calc(22px + var(--safe-b));z-index:40;width:60px;height:60px;border-radius:50%;background:var(--accent);color:var(--sur-accent);display:grid;place-items:center;box-shadow:var(--ombre);transition:transform .16s ease}
.fab:active{transform:scale(.93)}
.fab svg{width:26px;height:26px}

/* ---------- Feuille plein ecran ---------- */
.sheet{position:fixed;inset:0;z-index:60;background:var(--fond);display:flex;flex-direction:column;transform:translateY(100%);transition:transform .28s cubic-bezier(.32,.72,0,1)}
.sheet.open{transform:translateY(0)}
.sheet-top{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--trait);flex:0 0 auto}
.sheet-titre{font-family:var(--serif);font-size:18px;flex:1;margin:0;font-weight:400}
.icon-btn{color:var(--texte-doux);padding:8px;display:grid;place-items:center;border-radius:8px}
.icon-btn svg{width:20px;height:20px}
.icon-btn.danger{color:var(--danger)}
.sheet-body{flex:1;overflow-y:auto;padding:18px 20px calc(30px + var(--safe-b));-webkit-overflow-scrolling:touch}

/* ---------- Formulaire ---------- */
.champ{margin-bottom:24px}
.champ-titre{font-family:var(--serif);font-size:18px;margin:0 0 2px;font-weight:400}
.champ-aide{font-size:13.5px;color:var(--texte-doux);margin:0 0 10px}
textarea,input[type="datetime-local"],input[type="text"]{width:100%;background:var(--surface);border:1px solid var(--trait);border-radius:var(--r);padding:12px 13px;font-size:16px;resize:vertical}
textarea{min-height:88px}
textarea:focus,input:focus{outline:none;border-color:var(--accent)}

.grille-emo{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.emo-btn{border:1px solid var(--trait);border-radius:var(--r);background:var(--surface);padding:11px 6px;display:flex;flex-direction:column;align-items:center;gap:7px;transition:border-color .15s ease,background .15s ease}
.emo-btn .pastille{width:13px;height:13px;box-shadow:none}
.emo-btn span{font-family:var(--serif);font-size:15px;line-height:1.2;text-align:center}
.emo-btn[aria-pressed="true"]{background:var(--surface-2)}

.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.chip{font-size:13.5px;padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--trait);color:var(--texte-doux)}
.chip[aria-pressed="true"]{color:var(--texte);border-color:currentColor}
.chips-titre{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--texte-doux);margin:16px 0 0}

.rappel{background:var(--surface);border:1px solid var(--trait);border-radius:var(--r);padding:13px 14px;margin-bottom:16px}
.rappel-tete{display:flex;gap:14px;align-items:flex-start}
.rappel-aide{margin:6px 0 0;font-size:13px;color:var(--texte-doux)}
.chip-sens{text-align:left;line-height:1.35}
#f-sens-chips{margin-top:12px}
.rappel .corps{flex:0 0 78px;width:78px}
.rappel-txt{flex:1;min-width:0}
.rappel-txt .label{margin-bottom:5px}
.rappel-txt ul{margin:0;padding-left:16px;font-size:13.5px;color:var(--texte-doux)}
.rappel-txt li{margin-bottom:3px}

.intensite{display:flex;align-items:center;gap:12px}
input[type="range"]{flex:1;accent-color:var(--accent);background:none;border:0;padding:0}
.intensite output{font-family:var(--serif);font-size:22px;width:2.2ch;text-align:right;color:var(--accent)}

.btn{display:block;width:100%;padding:15px;border-radius:var(--r);background:var(--accent);color:var(--sur-accent);font-weight:600;font-size:16px;letter-spacing:.01em}
.btn:disabled{opacity:.4}
.btn-fantome{background:none;border:1px solid var(--trait);color:var(--texte-doux);font-weight:400;margin-top:10px}

/* ---------- Detail ---------- */
.detail-emo{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.detail-emo .pastille{width:14px;height:14px}
.detail-nom{font-family:var(--serif);font-size:27px;margin:0;font-weight:400}
.detail-date{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--texte-doux);margin:0 0 22px}
.detail-bloc{margin-bottom:20px}
.detail-bloc p{margin:0;white-space:pre-wrap}
.detail-bloc .vide-txt{color:var(--texte-doux);font-style:italic}

/* ---------- Reglages ---------- */
.reglages-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:15px 0;border-bottom:1px solid var(--trait)}
.reglages-item span{flex:1}
.reglages-item small{display:block;color:var(--texte-doux);font-size:13px;margin-top:2px}
.bloc-theme{padding:15px 0;border-bottom:1px solid var(--trait)}
.bloc-theme .chips{margin-top:10px}
.chip[data-theme-choix][aria-pressed="true"]{color:var(--sur-accent);background:var(--accent);border-color:var(--accent)}

.toast{position:fixed;left:50%;bottom:calc(96px + var(--safe-b));transform:translate(-50%,14px);background:var(--surface-2);border:1px solid var(--trait);border-radius:999px;padding:10px 18px;font-size:14px;z-index:80;opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;box-shadow:var(--ombre)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (min-width:640px){
  main,.sheet-body,.topbar,.tabs{max-width:640px;margin-inline:auto}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none !important;animation:none !important}
}
</style>
</head>
<body>

<header class="topbar">
  <h1 class="wordmark">Boussole des <em>émotions</em></h1>
  <p class="tagline">Repérer · Nommer · Noter</p>
</header>

<nav class="tabs" role="tablist">
  <button class="tab" role="tab" id="tab-ref" aria-selected="true" aria-controls="vue-ref">Référentiel</button>
  <button class="tab" role="tab" id="tab-journal" aria-selected="false" aria-controls="vue-journal">Journal</button>
  <button class="tab" role="tab" id="tab-reglages" aria-selected="false" aria-controls="vue-reglages">Réglages</button>
</nav>

<main>
  <section id="vue-ref" role="tabpanel" aria-labelledby="tab-ref"></section>
  <section id="vue-journal" role="tabpanel" aria-labelledby="tab-journal" class="hidden"></section>
  <section id="vue-reglages" role="tabpanel" aria-labelledby="tab-reglages" class="hidden"></section>
</main>

<button class="bandeau-install hidden" id="bandeau-install">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
  <span>Installer sur l'écran d'accueil</span>
</button>

<button class="fab" id="fab" aria-label="Nouvelle saisie">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<!-- Feuille : formulaire -->
<div class="sheet" id="sheet-form" role="dialog" aria-modal="true" aria-labelledby="form-titre">
  <div class="sheet-top">
    <button class="icon-btn" id="form-fermer" aria-label="Fermer sans enregistrer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
    <h2 class="sheet-titre" id="form-titre">Nouvelle saisie</h2>
  </div>
  <div class="sheet-body" id="form-body"></div>
</div>

<!-- Feuille : détail -->
<div class="sheet" id="sheet-detail" role="dialog" aria-modal="true" aria-labelledby="detail-titre">
  <div class="sheet-top">
    <button class="icon-btn" id="detail-fermer" aria-label="Fermer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <h2 class="sheet-titre" id="detail-titre">Saisie</h2>
    <button class="icon-btn" id="detail-modifier" aria-label="Modifier">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
    </button>
    <button class="icon-btn danger" id="detail-supprimer" aria-label="Supprimer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>
    </button>
  </div>
  <div class="sheet-body" id="detail-body"></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* Référentiel des émotions — transcription fidèle des fiches papier */
const REFERENTIEL = [

    signale: "Un danger, soit réel, soit potentiel, soit imaginaire. L'émotion est vraie, donc le danger signalé est toujours vécu comme vrai par la personne.",

    ],
    sensations: ["Peau pâle","Tension corporelle et musculaire","Tremblements","Transpiration","Rythme cardiaque ↗","Respiration ↗","Impression de manque d'air","Envie d'uriner, diarrhée, envie de vomir","Estomac noué"],
    zones: { tete: .6, visage: .55, gorge: .6, poitrine: 1, coeur: .95, ventre: .6, bassin: .2, brasHaut: .35, avantBras: .3, mains: .35, cuisses: -.5, jambes: -.6, pieds: -.55 },
    carteSource: "Nummenmaa 2014 (peur)"
  },
  {
    id: "joie",
    nom: "Joie",
    couleur: "#F2B733",
    famille: ["Amour","Amitié","Apaisement","Assurance","Extase","Soulagement","Béatitude","Calme","Confiance","Gaieté","Contentement","Plaisir","Ravissement","Espérance","Estime"],
    signale: "Une situation plaisante, ici et maintenant.",
    aide: [
      "Donner de l'énergie",
      "Donner de l'enthousiasme pour faire ce qui plaît",
      "Le partage avec autrui"

/* ============================================================
   Stockage — 100 % local. localStorage si disponible,
   sinon mémoire (aperçu en bac à sable).
   ============================================================ */
const Store = (() => {
  const CLE = "boussole.saisies.v1";
  let memoire = null;
  function dispo(){
    try { localStorage.setItem("__t","1"); localStorage.removeItem("__t"); return true; }
    catch(e){ return false; }
  }
  const ls = dispo();
  if(!ls) memoire = [];
  return {
    persistant: ls,
    lire(){
      if(!ls) return memoire.slice();
      try { return JSON.parse(localStorage.getItem(CLE) || "[]"); }
      catch(e){ return []; }
    },
    ecrire(liste){
      if(!ls){ memoire = liste.slice(); return true; }
      try { localStorage.setItem(CLE, JSON.stringify(liste)); return true; }
      catch(e){ return false; }
    }
  };
})();

/* ============================================================
   Hors ligne — enregistrement du service worker et diagnostic
   ============================================================ */
const HorsLigne = (() => {
  let etat = { supporte: false, enregistre: false, pret: false, fichiers: 0, attendus: 0, version: null };

  const local = location.protocol === "file:";

  async function init(){
    // Stockage persistant : sans cela, le navigateur peut évincer le cache et les
    // saisies quand la mémoire de l'appareil se remplit.
    try {
      if(navigator.storage && navigator.storage.persist){
        etat.persistant = await navigator.storage.persisted() || await navigator.storage.persist();
      }
    } catch(e){}
    if(!("serviceWorker" in navigator) || local) return rendreReglages();
    etat.supporte = true;
    try {
      await navigator.serviceWorker.register("sw.js");
      await navigator.serviceWorker.ready;
      etat.enregistre = true;
      navigator.serviceWorker.addEventListener("message", ev => {
        if(ev.data && ev.data.type === "etat-cache"){
          Object.assign(etat, ev.data);
          rendreReglages();
        }
      });
      interroger();
      // Le contenu est mis en cache pendant l'installation : on revérifie peu après.
      setTimeout(interroger, 2500);
    } catch(e){ /* enregistrement impossible : l'application reste utilisable en ligne */ }
    rendreReglages();
  }

  function interroger(){
    const sw = navigator.serviceWorker.controller;
    if(sw) sw.postMessage("etat-cache");
  }

  return { init, interroger, local, lire: () => etat };
})();

/* ============================================================
   Installation sur l'appareil
   ============================================================ */
const Install = (() => {
  let invite = null;
  const iOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const installee = () =>
    matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;

  window.addEventListener("beforeinstallprompt", ev => {
    ev.preventDefault();
    invite = ev;
    rendreReglages();
    majBandeau();
  });
  window.addEventListener("appinstalled", () => {
    invite = null;
    rendreReglages();
    majBandeau();
    toast("Application installée");
  });

  return {
    installee, iOS,
    possible: () => !!invite,
    async lancer(){
      if(!invite) return false;
      invite.prompt();
      const { outcome } = await invite.userChoice;
      invite = null;
      rendreReglages();
      majBandeau();
      if(outcome !== "accepted") toast("Installation annulée");
      return outcome === "accepted";
    }
  };
})();

function majBandeau(){
  const b = document.getElementById("bandeau-install");
  if(!b) return;
  b.classList.toggle("hidden", Install.installee() || !Install.possible());
}

/* ============================================================
   Thème — clair par défaut, sombre, ou selon l'appareil
   ============================================================ */
const Theme = (() => {
  const CLE = "boussole.theme.v1";
  const media = matchMedia("(prefers-color-scheme: dark)");
  let choix = "clair";
  try { choix = localStorage.getItem(CLE) || "clair"; } catch(e){}

  const effectif = () => choix === "systeme" ? (media.matches ? "sombre" : "clair") : choix;

  function appliquer(){
    const t = effectif();
    document.documentElement.dataset.theme = t;
    const meta = document.querySelector('meta[name="theme-color"]');
    if(meta) meta.setAttribute("content", t === "clair" ? "#F5F6F8" : "#12161C");
  }
  media.addEventListener("change", () => { if(choix === "systeme"){ appliquer(); redessiner(); } });

  return {
    effectif, appliquer,
    lire: () => choix,
    definir(v){
      choix = v;
      try { localStorage.setItem(CLE, v); } catch(e){}
      appliquer(); redessiner();
    }
  };
})();

/* Sur fond clair, les couleurs d'émotion sont assombries pour rester lisibles en texte. */
function foncer(hex, part){
  const n = parseInt(hex.slice(1), 16);
  const c = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(v => Math.round(v * (1 - part)));
  return `rgb(${c.join(",")})`;
}
const surTexte = c => Theme.effectif() === "clair" ? foncer(c, .34) : c;
const echap = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => (
  {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]
));

/* Silhouette composée de segments distincts : tête, cou, tronc, bras, mains, jambes */
const FORMES = [

].join("");

/* Échelle bipolaire des cartes corporelles.
   Valeurs > 0 : l'activité augmente (chaud, jusqu'au jaune).
   Valeurs < 0 : l'activité diminue (froid, jusqu'au cyan).
   Reproduit la logique des cartes de Nummenmaa et al., PNAS 2014. */
const ECHELLE_CHAUD = [[0,[90,14,8]],[.3,[196,42,16]],[.6,[240,126,18]],[1,[255,238,120]]];
const ECHELLE_FROID = [[0,[8,26,84]],[.45,[26,96,196]],[1,[92,214,240]]];

function tonCarte(v){
  const t = Math.min(1, Math.abs(v));
  const e = v >= 0 ? ECHELLE_CHAUD : ECHELLE_FROID;
  for(let i = 1; i < e.length; i++){
    if(t <= e[i][0] || i === e.length - 1){
      const [a, ca] = e[i-1], [b, cb] = e[i];
      const k = b === a ? 0 : (t - a) / (b - a);
      return "rgb(" + ca.map((c, j) => Math.round(c + (cb[j] - c) * k)).join(",") + ")";
    }
  }
}

function schemaCorps(emo, id){
  /* Les zones les plus intenses sont dessinées en dernier pour rester lisibles. */
  const points = [];
  Object.entries(emo.zones || {}).forEach(([z, v]) => {
    if(Math.abs(v) < .05) return;
    (ZONES[z] || []).forEach((p, i) => points.push({ ...p, v, cle: `${z}-${i}` }));
  });
  points.sort((a, b) => Math.abs(a.v) - Math.abs(b.v));

  const grad = points.map(p => {
    const c = tonCarte(p.v), o = Math.min(1, Math.abs(p.v) * 1.05);
    return `<radialGradient id="g-${id}-${p.cle}">
      <stop offset="0%" stop-color="${c}" stop-opacity="${(o).toFixed(2)}"/>
      <stop offset="45%" stop-color="${c}" stop-opacity="${(o * .55).toFixed(2)}"/>
      <stop offset="100%" stop-color="${c}" stop-opacity="0"/>
    </radialGradient>`;
  }).join("");

  const blobs = points.map(p =>
    `<circle cx="${p.x}" cy="${p.y}" r="${p.r}" fill="url(#g-${id}-${p.cle})"/>`
  ).join("");

  return `<svg viewBox="-4 0 108 240" role="img" aria-label="Carte corporelle : ${echap(String(emo.nom).toLowerCase())}">
    <defs>${grad}<clipPath id="clip-${id}">${FORMES}</clipPath></defs>
    <rect x="-4" y="0" width="108" height="240" rx="8" fill="#0C1015"/>
    <g class="silhouette">${FORMES}</g>
    <g clip-path="url(#clip-${id})">${blobs}</g>
  </svg>`;
}

/* Barre de légende de l'échelle */
function legendeCarte(id){
  const paliers = [-1, -.6, -.25, 0, .25, .6, 1];
  return `<svg class="echelle" viewBox="0 0 100 10" role="img" aria-label="Échelle : de l'activité qui diminue à l'activité qui augmente">
    <defs><linearGradient id="ech-${id}">
      ${paliers.map((v, i) => `<stop offset="${(i / (paliers.length - 1) * 100).toFixed(0)}%" stop-color="${v === 0 ? "#0C1015" : tonCarte(v)}"/>`).join("")}
    </linearGradient></defs>
    <rect x="0" y="0" width="100" height="10" rx="3" fill="url(#ech-${id})"/>
  </svg>`;
}

const fmtHeure = ts => new Date(ts).toLocaleTimeString("fr-FR", { hour:"2-digit", minute:"2-digit" });
const fmtJour  = ts => new Date(ts).toLocaleDateString("fr-FR", { weekday:"long", day:"numeric", month:"long", year:"numeric" });
const cleJour  = ts => new Date(ts).toLocaleDateString("fr-CA");

function rendreJournal(){
  const el = document.getElementById("vue-journal");
  const saisies = Store.lire().sort((a,b) => new Date(b.ts) - new Date(a.ts));

  if(!saisies.length){
    el.innerHTML = `
      <div class="vide">
        <div class="corps">${schemaCorps({ couleur:"#7C8896", nom:"votre ressenti", zones:{ poitrine:.5, ventre:.35 } }, "vide")}</div>
        <h2>Le journal est vide</h2>
        <p>Appuyez sur le + pour noter une première situation et l'émotion qui l'accompagne.</p>
      </div>`;
    return;
  }

  let html = "", jourCourant = "";
  saisies.forEach(s => {
    const j = cleJour(s.ts);
    if(j !== jourCourant){
      if(jourCourant) html += `</ul>`;
      html += `<p class="jour-sep">${echap(fmtJour(s.ts))}</p><ul class="journal">`;
      jourCourant = j;
    }
    const e = emoParId(s.emotion) || { nom:"—", couleur:"#7C8896" };
    html += `
      <li><button class="entry" data-id="${echap(s.id)}" style="--dot:${e.couleur}">
        <span class="entry-date">${echap(fmtHeure(s.ts))}${s.intensite ? " · " + s.intensite + "/10" : ""}</span>
        <p class="entry-emo">${echap(e.nom)}${s.nuance ? ` <span class="entry-nuance">${echap(s.nuance)}</span>` : ""}</p>
        <p class="entry-sit">${echap(s.situation || "Situation non renseignée")}</p>
      </button></li>`;
  });
  html += `</ul>`;
  el.innerHTML = html;

  el.querySelectorAll(".entry").forEach(b =>
    b.addEventListener("click", () => ouvrirDetail(b.dataset.id))
  );
}

  const n = Store.lire().length;
  el.innerHTML = `
    <p style="color:var(--texte-doux);font-size:14.5px;margin:0 0 6px">
      Vos saisies sont enregistrées uniquement sur cet appareil, dans le navigateur.
      Rien n'est envoyé sur internet.
      ${Store.persistant ? "" : "<br><strong style='color:var(--accent)'>Aperçu : le stockage local est indisponible ici, les saisies seront perdues à la fermeture.</strong>"}
    </p>
    ${blocHorsLigne()}
    ${blocInstallation()}
    <div class="bloc-theme">
      <span>Apparence</span>
      <div class="chips">
        ${[["clair","Clair"],["sombre","Sombre"],["systeme","Comme l'appareil"]].map(([v,l]) =>
          `<button type="button" class="chip" data-theme-choix="${v}" aria-pressed="${Theme.lire() === v}">${l}</button>`).join("")}
      </div>
    </div>
    <button class="reglages-item" id="export">
      <span>Exporter le journal<small>${n} saisie${n > 1 ? "s" : ""} · fichier JSON à conserver ou à transmettre</small></span>
    </button>
    <button class="reglages-item" id="import">
      <span>Importer un journal<small>Ajoute les saisies d'un fichier exporté</small></span>
    </button>
    <button class="reglages-item" id="effacer" style="color:var(--danger)">
      <span>Effacer toutes les saisies<small style="color:var(--texte-doux)">Action définitive</small></span>
    </button>
    <input type="file" id="fichier" accept="application/json,.json" class="hidden">
  `;

  const br = el.querySelector("#reverifier");
  if(br) br.addEventListener("click", () => { HorsLigne.interroger(); toast("Vérification…"); });

  const bi = el.querySelector("#installer");
  if(bi) bi.addEventListener("click", () => Install.lancer());

  el.querySelectorAll("[data-theme-choix]").forEach(b =>
    b.addEventListener("click", () => Theme.definir(b.dataset.themeChoix))
  );

  el.querySelector("#export").addEventListener("click", () => {
    const data = JSON.stringify({ appli:"boussole-emotions", version:1, saisies:Store.lire() }, null, 2);
    const url = URL.createObjectURL(new Blob([data], { type:"application/json" }));
    const a = document.createElement("a");
    a.href = url;
    a.download = `journal-emotions-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
    toast("Journal exporté");
  });

  el.querySelector("#import").addEventListener("click", () => el.querySelector("#fichier").click());
  el.querySelector("#fichier").addEventListener("change", ev => {
    const f = ev.target.files[0];
    if(!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const lu = JSON.parse(r.result);
        const arrivantes = Array.isArray(lu) ? lu : (lu.saisies || []);
        if(!Array.isArray(arrivantes)) throw new Error();
        const actuelles = Store.lire();
        const ids = new Set(actuelles.map(s => s.id));
        const nouvelles = arrivantes.filter(s => s && s.id && s.ts && !ids.has(s.id));
        Store.ecrire(actuelles.concat(nouvelles));
        rendreReglages(); rendreJournal();
        toast(nouvelles.length ? `${nouvelles.length} saisie${nouvelles.length > 1 ? "s" : ""} importée${nouvelles.length > 1 ? "s" : ""}` : "Aucune saisie nouvelle dans ce fichier");
      } catch(e){
        toast("Fichier illisible : attendu un export de cette application");
      }
      ev.target.value = "";
    };
    r.readAsText(f);
  });

  el.querySelector("#effacer").addEventListener("click", () => {
    if(!Store.lire().length) return toast("Le journal est déjà vide");
    if(confirm("Effacer définitivement toutes les saisies de cet appareil ?")){
      Store.ecrire([]); rendreReglages(); rendreJournal(); toast("Journal effacé");
    }
  });
}

function blocHorsLigne(){
  const e = HorsLigne.lire();
  let voyant, titre, aide;

  if(HorsLigne.local){
    voyant = "attente";
    titre = "Ouverte depuis un fichier local";
    aide = "Tout fonctionne sans connexion, mais les saisies sont écrites dans le navigateur de CET ordinateur — pas sur le support depuis lequel l'application est lancée. Sur un poste partagé, exportez votre journal puis effacez les saisies avant de partir.";
  } else if(!e.supporte){
    voyant = "ko";
    titre = "Hors ligne : non pris en charge";
    aide = "Ce navigateur ne gère pas les service workers.";
  } else if(e.pret){
    voyant = "ok";
    titre = "Prêt pour le hors ligne";
    aide = `${e.fichiers} fichiers en cache (${e.version}). Vous pouvez couper la connexion, ou même retirer le site : l'application démarre depuis l'appareil.`
      + (e.persistant ? " Stockage marqué persistant." : " Le navigateur peut toutefois libérer cet espace s'il vient à manquer de mémoire.");
  } else if(e.enregistre){
    voyant = "attente";
    titre = "Mise en cache en cours…";
    aide = "Restez connecté quelques secondes, puis rouvrez cet écran.";
  } else {
    voyant = "ko";
    titre = "Hors ligne : non activé";
    aide = "L'enregistrement a échoué. Rechargez la page en étant connecté.";
  }

  return `<div class="bloc-install">
    <p class="install-titre"><span class="voyant ${voyant}"></span>${echap(titre)}</p>
    <p class="install-aide">${echap(aide)}</p>
    ${e.supporte && !e.pret ? '<button class="btn btn-fantome" id="reverifier" style="margin-top:0">Revérifier</button>' : ""}
  </div>`;
}

function blocInstallation(){
  if(Install.installee()){
    return `<div class="bloc-install">
      <p class="install-titre">Application installée</p>
      <p class="install-aide">Elle s'ouvre depuis l'écran d'accueil et fonctionne sans connexion.</p>
    </div>`;
  }
  if(Install.possible()){
    return `<div class="bloc-install">
      <p class="install-titre">Installer sur le téléphone</p>
      <p class="install-aide">Une icône sur l'écran d'accueil, en plein écran, utilisable sans connexion.</p>
      <button class="btn" id="installer">Installer l'application</button>
    </div>`;
  }
  const etapes = Install.iOS
    ? "Dans Safari : bouton Partager, puis « Sur l'écran d'accueil »."
    : "Dans Chrome : menu ⋮, puis « Installer l'application » ou « Ajouter à l'écran d'accueil ».";
  return `<div class="bloc-install">
    <p class="install-titre">Installer sur le téléphone</p>
    <p class="install-aide">${echap(etapes)}</p>
    <p class="install-aide" style="margin-top:6px">L'installation exige une adresse en HTTPS.</p>
  </div>`;
}

/* ============================================================
   Formulaire de saisie
   ============================================================ */
let brouillon = null;

function tsLocalInput(d){
  const p = n => String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}

function ouvrirFormulaire(saisie){
  brouillon = saisie ? JSON.parse(JSON.stringify(saisie)) : {
    id: (crypto.randomUUID ? crypto.randomUUID() : "s" + Date.now() + Math.random().toString(16).slice(2)),
    ts: new Date().toISOString(),
    emotion: null, nuance: "", situation: "", sensationsChoisies: [], sensations: "", pensees: "", comportements: "", intensite: 5
  };
  if(!Array.isArray(brouillon.sensationsChoisies)) brouillon.sensationsChoisies = [];
  document.getElementById("form-titre").textContent = saisie ? "Modifier la saisie" : "Nouvelle saisie";
  rendreFormulaire();
  ouvrirFeuille("sheet-form");
}

function rendreFormulaire(){
  const body = document.getElementById("form-body");
  const e = brouillon.emotion ? emoParId(brouillon.emotion) : null;

  body.innerHTML = `
    <div class="champ">
      <p class="label">Quand</p>
      <input type="datetime-local" id="f-ts" value="${tsLocalInput(new Date(brouillon.ts))}">
    </div>

    <div class="champ">
      <h3 class="champ-titre">Situation</h3>
      <p class="champ-aide">Ce qui se passe.</p>
      <textarea id="f-situation" placeholder="J'attends un ami, il est en retard…">${echap(brouillon.situation)}</textarea>
    </div>

    <div class="champ">
      <h3 class="champ-titre">Émotion</h3>
      <p class="champ-aide">Ce que je ressens dans mon être.</p>
      <div class="grille-emo">
        ${REFERENTIEL.map(x => `
          <button type="button" class="emo-btn" data-emo="${x.id}"
                  aria-pressed="${brouillon.emotion === x.id}"
                  style="${brouillon.emotion === x.id ? `border-color:${x.couleur}` : ""}">
            <span class="pastille" style="background:${x.couleur}"></span>
            <span>${echap(x.nom)}</span>
          </button>`).join("")}
      </div>
      ${e ? `
        <p class="chips-titre">Préciser — petit frère, petite sœur</p>
        <div class="chips" id="f-nuances">
          ${e.famille.map(m => `<button type="button" class="chip" data-nuance="${echap(m)}"
              aria-pressed="${brouillon.nuance === m}"
              style="${brouillon.nuance === m ? `color:${surTexte(e.couleur)};border-color:${surTexte(e.couleur)}` : ""}">${echap(m)}</button>`).join("")}
        </div>
        <input type="text" id="f-nuance-libre" placeholder="ou un autre mot à vous" value="${echap(brouillon.nuance)}" style="margin-top:10px">
      ` : ""}
    </div>

    ${e ? `
    <div class="champ">
      <h3 class="champ-titre">Intensité</h3>
      <p class="champ-aide">De 0, à peine perceptible, à 10, envahissante.</p>
      <div class="intensite">
        <input type="range" id="f-intensite" min="0" max="10" step="1" value="${brouillon.intensite}">
        <output id="f-intensite-val">${brouillon.intensite}</output>
      </div>
    </div>` : ""}

    <div class="champ">
      <h3 class="champ-titre">Sensations physiologiques</h3>
      <p class="champ-aide">Ce que je perçois en moi, dans mon corps.</p>
      ${e ? `
        <div class="rappel">
          <div class="rappel-tete">
            <div class="corps">${schemaCorps(e, "form-" + e.id)}${legendeCarte("form-" + e.id)}</div>
            <div class="rappel-txt">
              <p class="label">Repères — ${echap(e.nom)}</p>
              <p class="rappel-aide">Appuyez sur ce que vous ressentez pour l'ajouter.</p>
            </div>
          </div>
          <div class="chips" id="f-sens-chips">
            ${e.sensations.map(x => {
              const pris = brouillon.sensationsChoisies.includes(x);
              return `<button type="button" class="chip chip-sens" data-sens="${echap(x)}" aria-pressed="${pris}"
                style="${pris ? `color:${surTexte(e.couleur)};border-color:${surTexte(e.couleur)}` : ""}">${echap(x)}</button>`;
            }).join("")}
          </div>
        </div>` : ""}
      <textarea id="f-sensations" placeholder="Autre chose que vous percevez, avec vos mots…">${echap(brouillon.sensations)}</textarea>
    </div>

    <div class="champ">
      <h3 class="champ-titre">Pensées</h3>
      <p class="champ-aide">Ce que je me dis dans ma tête sur ce qu'il se passe.</p>
      <textarea id="f-pensees" placeholder="Il lui est arrivé un accident…">${echap(brouillon.pensees)}</textarea>
    </div>

    <div class="champ">
      <h3 class="champ-titre">Comportements</h3>
      <p class="champ-aide">Ce que je fais.</p>
      <textarea id="f-comportements" placeholder="Rumination, je téléphone à la gendarmerie, aux hôpitaux…">${echap(brouillon.comportements)}</textarea>
    </div>

    <button class="btn" id="f-enregistrer" ${brouillon.emotion ? "" : "disabled"}>
      ${brouillon.emotion ? "Enregistrer la saisie" : "Choisissez une émotion pour enregistrer"}
    </button>
    <button class="btn btn-fantome" id="f-annuler">Annuler</button>
    <p style="color:var(--texte-doux);font-size:13px;text-align:center;margin:16px 0 0">
      Une même situation peut faire naître plusieurs émotions : notez-la autant de fois qu'il le faut.
    </p>
  `;

  const capter = () => {
    brouillon.situation     = val("f-situation");
    brouillon.sensations    = val("f-sensations");
    brouillon.pensees       = val("f-pensees");
    brouillon.comportements = val("f-comportements");
    const libre = document.getElementById("f-nuance-libre");
    if(libre) brouillon.nuance = libre.value.trim();
    const ts = document.getElementById("f-ts").value;
    if(ts) brouillon.ts = new Date(ts).toISOString();
    const inten = document.getElementById("f-intensite");
    if(inten) brouillon.intensite = Number(inten.value);
  };
  const val = id => (document.getElementById(id) || {}).value || "";

  body.querySelectorAll("[data-emo]").forEach(b =>
    b.addEventListener("click", () => {
      capter();
      const nouv = b.dataset.emo;
      if(brouillon.emotion !== nouv){ brouillon.emotion = nouv; brouillon.nuance = ""; brouillon.sensationsChoisies = []; }
      rendreFormulaire();
      document.getElementById("f-nuances")?.scrollIntoView({ block:"nearest", behavior:"smooth" });
    })
  );

  body.querySelectorAll("[data-sens]").forEach(b =>
    b.addEventListener("click", () => {
      capter();
      const v = b.dataset.sens;
      const i = brouillon.sensationsChoisies.indexOf(v);
      if(i === -1) brouillon.sensationsChoisies.push(v);
      else brouillon.sensationsChoisies.splice(i, 1);
      rendreFormulaire();
      document.getElementById("f-sens-chips")?.scrollIntoView({ block:"nearest", behavior:"smooth" });
    })
  );

  body.querySelectorAll("[data-nuance]").forEach(b =>
    b.addEventListener("click", () => {
      capter();
      brouillon.nuance = (brouillon.nuance === b.dataset.nuance) ? "" : b.dataset.nuance;
      rendreFormulaire();
    })
  );

  const inten = document.getElementById("f-intensite");
  if(inten) inten.addEventListener("input", () => document.getElementById("f-intensite-val").textContent = inten.value);

  document.getElementById("f-annuler").addEventListener("click", fermerFormulaire);
  document.getElementById("f-enregistrer").addEventListener("click", () => {
    capter();
    if(!brouillon.emotion) return;
    const liste = Store.lire().filter(s => s.id !== brouillon.id);
    liste.push(brouillon);
    if(!Store.ecrire(liste)) return toast("Enregistrement impossible : mémoire du navigateur pleine");
    fermerFeuille("sheet-form");
    fermerFeuille("sheet-detail");
    rendreJournal(); rendreReglages(); allerA("journal");
    toast("Saisie enregistrée");
  });
}

function fermerFormulaire(){
  const rempli = brouillon && (brouillon.emotion || brouillon.situation || brouillon.sensations || brouillon.pensees || brouillon.comportements || (brouillon.sensationsChoisies || []).length);
  if(rempli && !confirm("Fermer sans enregistrer ? La saisie en cours sera perdue.")) return;
  fermerFeuille("sheet-form");
}

/* ============================================================
   Détail d'une saisie
   ============================================================ */
let idDetail = null;

function ouvrirDetail(id, rafraichir){
  const s = Store.lire().find(x => x.id === id);
  if(!s) return;
  idDetail = id;
  const e = emoParId(s.emotion) || { nom:"—", couleur:"#7C8896", zones:{} };
  const blocSensations = (saisie, emo) => {
    const choisies = Array.isArray(saisie.sensationsChoisies) ? saisie.sensationsChoisies : [];
    const libre = saisie.sensations;
    return `<div class="detail-bloc">
      <p class="label">Sensations physiologiques</p>
      <p class="champ-aide" style="margin:0 0 6px">Ce que je perçois en moi, dans mon corps</p>
      ${choisies.length ? `<div class="mots" style="margin-bottom:${libre ? "10px" : "0"}">
        ${choisies.map(x => `<span class="mot" style="border-color:${surTexte(emo.couleur)}">${echap(x)}</span>`).join("")}
      </div>` : ""}
      ${libre ? `<p>${echap(libre)}</p>` : (choisies.length ? "" : `<p class="vide-txt">Non renseigné</p>`)}
    </div>`;
  };

  const bloc = (titre, aide, txt) => `
    <div class="detail-bloc">
      <p class="label">${echap(titre)}</p>
      <p class="champ-aide" style="margin:0 0 4px">${echap(aide)}</p>
      ${txt ? `<p>${echap(txt)}</p>` : `<p class="vide-txt">Non renseigné</p>`}
    </div>`;

  document.getElementById("detail-body").innerHTML = `
    <div class="corps corps-flottant">${schemaCorps(e, "det-" + e.id)}</div>
    <div class="detail-emo">
      <span class="pastille" style="background:${e.couleur}"></span>
      <h3 class="detail-nom">${echap(e.nom)}</h3>
    </div>
    ${s.nuance ? `<p style="margin:0 0 6px;font-family:var(--serif);font-size:17px;color:${surTexte(e.couleur)}">${echap(s.nuance)}</p>` : ""}
    <p class="detail-date">${echap(fmtJour(s.ts))} · ${echap(fmtHeure(s.ts))}${s.intensite != null ? ` · intensité ${s.intensite}/10` : ""}</p>
    ${bloc("Situation", "Ce qui se passe", s.situation)}
    ${blocSensations(s, e)}
    ${bloc("Pensées", "Ce que je me dis dans ma tête sur ce qu'il se passe", s.pensees)}
    ${bloc("Comportements", "Ce que je fais", s.comportements)}
  `;
  if(!rafraichir) ouvrirFeuille("sheet-detail");
}

document.getElementById("detail-modifier").addEventListener("click", () => {
  const s = Store.lire().find(x => x.id === idDetail);
  if(s) ouvrirFormulaire(s);
});
document.getElementById("detail-supprimer").addEventListener("click", () => {
  if(!confirm("Supprimer définitivement cette saisie ?")) return;
  Store.ecrire(Store.lire().filter(s => s.id !== idDetail));
  fermerFeuille("sheet-detail");
  rendreJournal(); rendreReglages();
  toast("Saisie supprimée");
});
document.getElementById("detail-fermer").addEventListener("click", () => fermerFeuille("sheet-detail"));
document.getElementById("form-fermer").addEventListener("click", fermerFormulaire);
document.getElementById("fab").addEventListener("click", () => ouvrirFormulaire(null));
document.getElementById("bandeau-install").addEventListener("click", () => Install.lancer());

/* ============================================================
   Navigation, feuilles, toast
   ============================================================ */
const pile = [];
let ignorerPop = 0;

function ouvrirFeuille(id){
  if(pile.includes(id)) return;
  const f = document.getElementById(id);
  f.style.zIndex = String(60 + pile.length);
  f.querySelector(".sheet-body").scrollTop = 0;
  f.classList.add("open");
  pile.push(id);
  document.body.style.overflow = "hidden";
  history.pushState({ feuille:id }, "");
}
function fermerFeuille(id){
  const i = pile.lastIndexOf(id);
  if(i === -1) return;
  pile.splice(i, 1);
  document.getElementById(id).classList.remove("open");
  if(!pile.length) document.body.style.overflow = "";
  ignorerPop++;
  history.back();
}
window.addEventListener("popstate", () => {
  if(ignorerPop > 0){ ignorerPop--; return; }
  const id = pile.pop();
  if(id){
    document.getElementById(id).classList.remove("open");
    if(!pile.length) document.body.style.overflow = "";
  }
});
document.addEventListener("keydown", ev => {
  if(ev.key !== "Escape" || !pile.length) return;
  const haut = pile[pile.length - 1];
  haut === "sheet-form" ? fermerFormulaire() : fermerFeuille(haut);
});

const VUES = { ref:"vue-ref", journal:"vue-journal", reglages:"vue-reglages" };
function allerA(nom){
  Object.entries(VUES).forEach(([k, id]) => {
    document.getElementById(id).classList.toggle("hidden", k !== nom);
    document.getElementById("tab-" + k).setAttribute("aria-selected", String(k === nom));
  });
  document.getElementById("fab").classList.toggle("hidden", nom === "reglages");
  window.scrollTo(0, 0);
}
Object.keys(VUES).forEach(k =>
  document.getElementById("tab-" + k).addEventListener("click", () => allerA(k))
);

let minuteurToast;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(minuteurToast);
  minuteurToast = setTimeout(() => t.classList.remove("show"), 2600);
}

/* ============================================================
   Démarrage
   ============================================================ */
Theme.appliquer();
majBandeau();
rendreReferentiel();
rendreJournal();
rendreReglages();
allerA("ref");

HorsLigne.init();
</script>
